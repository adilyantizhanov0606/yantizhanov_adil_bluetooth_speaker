<!DOCTYPE html>
<html lang="en">
  <head>
    <title>RESN8R - Bluetooh Speaker</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/grid.css" rel="stylesheet"/>
    <link href="css/main.css" rel="stylesheet"/>
  </head>
  <body>
    <div class="grid-con center-grid-con">
      <section class="col-span-full">
        <h2 class="visually-hidden">Bluetooth Speaker</h2>
        <model-viewer src="model/bluetooth-speaker.glb" camera-controls tone-mapping="neutral" shadow-intensity="1.31" exposure="1.2" camera-orbit="134.5deg 70.25deg 80.56m" field-of-view="30deg">
              <button class="Hotspot" slot="hotspot-1" data-position="-3.437272295011528m 1.2212499135803818m 0.38426337185028653m" data-normal="0.9717366920616508m 0.03886019871023304m 0.23284691592821613m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-1">
                  </div>
              </button>
              <button class="Hotspot" slot="hotspot-2" data-position="-3.9882141175092016m 2.096699506044388m 0.5579431507710462m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-2">
                  </div>
              </button>
              <button class="Hotspot" slot="hotspot-3" data-position="-3.7969021899806616m 2.241178035736085m -0.09680911372614781m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-3">
                  </div>
              </button>
              <button class="Hotspot" slot="hotspot-4" data-position="-3.9564579331286045m 2.146151122526674m 1.0353905761452014m" data-normal="0.08002201731848849m 0.9896735630256633m 0.1189231491021315m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-4">
                  </div>
              </button>
            </model-viewer>  
      </section> 
    </div>
  <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
