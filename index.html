<!DOCTYPE html>
<html lang="en">
  <head>
    <title>DR Sound - Bluetooh Speaker</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet"/>
    <link href="css/main.css" rel="stylesheet"/>
  </head>
  <body>
    <div class="grid-con center-grid-con">
        <header class="col-span-full" id="main-header">
            <nav>
                <ul>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Features</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
    </div>
    <main>
    <div class="grid-con center-grid-con">
      <section class="ar-model col-span-full">
         <h2>FEEL THE SOUND.</h2>
          <p>Wireless. Powerful. Yours.</p>
          <p>EXPLORE IN 3D.</p>
        <model-viewer src="model/bluetooth-speaker.glb" camera-controls tone-mapping="neutral" shadow-intensity="1.31" exposure="1.2" camera-orbit="134.5deg 70.25deg 80.56m" field-of-view="30deg">
              <button class="Hotspot" slot="hotspot-1" data-position="-3.437272295011528m 1.2212499135803818m 0.38426337185028653m" data-normal="0.9717366920616508m 0.03886019871023304m 0.23284691592821613m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-1">
                  </div>
              </button>
              <button class="Hotspot" slot="hotspot-2" data-position="-3.9882141175092016m 2.096699506044388m 0.5579431507710462m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-2">
                  </div>
              </button>
              <button class="Hotspot" slot="hotspot-3" data-position="-3.7969021899806616m 2.241178035736085m -0.09680911372614781m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-3">
                  </div>
              </button>
              <button class="Hotspot" slot="hotspot-4" data-position="-3.9564579331286045m 2.146151122526674m 1.0353905761452014m" data-normal="0.08002201731848849m 0.9896735630256633m 0.1189231491021315m" data-visibility-attribute="visible">
                  <div class="HotspotAnnotation" id="hotspot-4">
                  </div>
              </button>
        </model-viewer>  
      </section> 
      <section class="exploded_view col-span-full">

          <div>
              <canvas id="explode-view"></canvas> 
          </div>
      </section>

      <div class="col-span-full" id="comp">
                    <div id="mobile-tablet-view">
                        <img src="images/bt_speaker.jpg" alt="#">
                        <img src="images/bt_xray.jpg" alt="#">
                    </div>
                </div>
                <div class="col-span-full">
                    <div id="comparison-cont">
                        <div id="color-div">
                            <div id="divisor"></div>
                        </div>
                        <input type="range" min="0" max="100" value="50" id="slider">
                    </div>
                </div>

    </div>
  <footer>
    <section class="footer">
    <h3>DR. SOUND 2026</h3>
    </section>
  </footer>
  </main>
  <!-- Loads <model-viewer> for browsers: -->
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@latest/bundled/lenis.min.js"></script>
    <script>
        const lenis = new Lenis()
        lenis.on('scroll', (e) => {
        })

        function raf(time) {
            lenis.raf(time)
            requestAnimationFrame(raf)
        }

        requestAnimationFrame(raf)
  
    </script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.0/ScrollTrigger.js"></script>
    <script src="js/comparison.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
